<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs sm md lg xl pill" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans);display:flex;gap:14px;flex-wrap:wrap}
.box{width:92px;height:92px;background:var(--cib-white);border:1px solid var(--border-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.box .t{font:600 12px/1 var(--font-sans)}.box .v{font:500 10px/1 var(--font-mono);color:var(--fg-3)}
</style></head><body>
<div class="box" style="border-radius:var(--r-xs)"><div class="t">xs</div><div class="v">4</div></div>
<div class="box" style="border-radius:var(--r-sm)"><div class="t">sm</div><div class="v">8</div></div>
<div class="box" style="border-radius:var(--r-md)"><div class="t">md · card</div><div class="v">12</div></div>
<div class="box" style="border-radius:var(--r-lg)"><div class="t">lg</div><div class="v">18</div></div>
<div class="box" style="border-radius:var(--r-xl)"><div class="t">xl · brand</div><div class="v">28</div></div>
<div class="box" style="border-radius:var(--r-pill)"><div class="t">pill</div><div class="v">999</div></div>
</body></html>
