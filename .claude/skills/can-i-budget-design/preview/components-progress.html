<!doctype html>
<!-- @dsCard group="Components" name="Progress & sparkline" subtitle="Budget track + mini bar chart" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--bg-page);font-family:var(--font-sans)}
.card{background:#fff;border:1px solid var(--border-1);border-radius:var(--r-md);padding:14px 16px}
.row{display:flex;justify-content:space-between;margin-bottom:8px;font:var(--t-body-sm);color:var(--fg-2)}
.track{height:10px;background:var(--cib-n-100);border-radius:var(--r-pill);overflow:hidden;position:relative}
.fill{height:100%;background:var(--cib-teal-400);border-radius:var(--r-pill);transition:width .6s cubic-bezier(.2,.9,.2,1.2)}
.over{background:var(--money-owed)}
.sub{font:var(--t-caption);color:var(--fg-3);margin-top:8px;display:flex;justify-content:space-between}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px;margin-top:10px}
.spark span{flex:1;background:var(--cib-teal-300);border-radius:2px}
</style></head><body>
<div class="card">
  <div class="row"><div>Groceries</div><div style="font-variant-numeric:tabular-nums"><b>$312</b> / $400</div></div>
  <div class="track"><div class="fill" style="width:78%"></div></div>
  <div class="sub"><span>78% used</span><span>5 days left</span></div>
  <div class="spark">
    <span style="height:40%"></span><span style="height:55%"></span><span style="height:30%"></span>
    <span style="height:72%"></span><span style="height:48%"></span><span style="height:88%"></span>
    <span style="height:60%"></span><span style="height:35%"></span><span style="height:68%"></span>
    <span style="height:82%"></span><span style="height:44%"></span><span style="height:90%"></span>
  </div>
</div>
</body></html>
