<!doctype html>
<!-- @dsCard group="Colors" name="Color scales" subtitle="Teal & warm neutrals, 9 steps" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.sw{border-radius:var(--r-xs);padding:8px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.n{font:600 11px/1 var(--font-sans)}.h{font:500 10px/1 var(--font-mono);opacity:.7}
.row-label{font:600 11px/1 var(--font-sans);color:var(--fg-2);margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
</style></head>
<body>
<div class="row-label">Teal</div>
<div class="grid">
  <div class="sw" style="background:var(--cib-teal-50);color:var(--cib-ink)"><div class="n">50</div><div class="h">E6F4F2</div></div>
  <div class="sw" style="background:var(--cib-teal-100);color:var(--cib-ink)"><div class="n">100</div><div class="h">BDE0DC</div></div>
  <div class="sw" style="background:var(--cib-teal-200);color:var(--cib-ink)"><div class="n">200</div><div class="h">7EC3BC</div></div>
  <div class="sw" style="background:var(--cib-teal-300);color:#fff"><div class="n">300</div><div class="h">3FA69B</div></div>
  <div class="sw" style="background:var(--cib-teal-400);color:#fff"><div class="n">400</div><div class="h">1E8F85</div></div>
  <div class="sw" style="background:var(--cib-teal-500);color:#fff"><div class="n">500</div><div class="h">16766E</div></div>
  <div class="sw" style="background:var(--cib-teal-600);color:#fff"><div class="n">600</div><div class="h">0E5E57</div></div>
  <div class="sw" style="background:var(--cib-teal-700);color:#fff"><div class="n">700</div><div class="h">0A4942</div></div>
  <div class="sw" style="background:var(--cib-teal-800);color:#fff"><div class="n">800</div><div class="h">06332E</div></div>
</div>
<div class="row-label">Neutrals (warm green-grey)</div>
<div class="grid">
  <div class="sw" style="background:var(--cib-n-50);color:var(--cib-ink);border:1px solid var(--border-1)"><div class="n">50</div><div class="h">F7F8F7</div></div>
  <div class="sw" style="background:var(--cib-n-100);color:var(--cib-ink)"><div class="n">100</div><div class="h">EEF0EF</div></div>
  <div class="sw" style="background:var(--cib-n-200);color:var(--cib-ink)"><div class="n">200</div><div class="h">DBDEDD</div></div>
  <div class="sw" style="background:var(--cib-n-300);color:var(--cib-ink)"><div class="n">300</div><div class="h">BCC1C0</div></div>
  <div class="sw" style="background:var(--cib-n-400);color:#fff"><div class="n">400</div><div class="h">8C9492</div></div>
  <div class="sw" style="background:var(--cib-n-500);color:#fff"><div class="n">500</div><div class="h">5E6664</div></div>
  <div class="sw" style="background:var(--cib-n-600);color:#fff"><div class="n">600</div><div class="h">3E4544</div></div>
  <div class="sw" style="background:var(--cib-n-700);color:#fff"><div class="n">700</div><div class="h">262B2A</div></div>
  <div class="sw" style="background:var(--cib-n-800);color:#fff"><div class="n">800</div><div class="h">14191A</div></div>
</div>
</body></html>
