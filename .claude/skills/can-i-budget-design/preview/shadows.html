<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Soft product + pop brand shadow" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg-page);font-family:var(--font-sans);display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.card{width:140px;height:80px;background:#fff;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--font-sans);color:var(--fg-2)}
.pop{background:var(--cib-yellow-400);border:2px solid var(--cib-black);color:var(--cib-ink);box-shadow:var(--shadow-pop)}
.lbl{font:500 10px/1 var(--font-mono);color:var(--fg-3);margin-top:6px;text-align:center}
.wrap{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="wrap"><div class="card" style="box-shadow:var(--shadow-xs)">xs</div><div class="lbl">--shadow-xs</div></div>
<div class="wrap"><div class="card" style="box-shadow:var(--shadow-sm)">sm</div><div class="lbl">--shadow-sm</div></div>
<div class="wrap"><div class="card" style="box-shadow:var(--shadow-md)">md</div><div class="lbl">--shadow-md</div></div>
<div class="wrap"><div class="card" style="box-shadow:var(--shadow-lg)">lg</div><div class="lbl">--shadow-lg</div></div>
<div class="wrap"><div class="card pop">pop · signature</div><div class="lbl">--shadow-pop · brand</div></div>
</body></html>
