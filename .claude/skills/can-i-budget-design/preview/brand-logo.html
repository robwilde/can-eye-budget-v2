<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Primary mark on teal field" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--cib-teal-400);font-family:var(--font-sans);display:flex;gap:22px;align-items:center;min-height:180px}
.logo{height:180px;width:auto;display:block;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18))}
.stack{display:flex;flex-direction:column;gap:8px;max-width:320px}
.eyebrow{font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cib-cream-50);opacity:.85}
.h{font:900 28px/1.05 var(--font-display);color:#fff;letter-spacing:-.01em;margin:0}
.tag{color:#fff;font:400 13px/1.5 var(--font-sans);opacity:.92;margin:0}
</style></head><body>
<img class="logo" src="../assets/logo.png" alt="Can-I-Budget logo">
<div class="stack">
  <div class="eyebrow">Primary mark</div>
  <p class="h">Can I spend this?</p>
  <p class="tag">The answer in three numbers — Owed, Available, Needed.</p>
</div>
</body></html>
