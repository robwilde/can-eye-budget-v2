<!doctype html>
<!-- @dsCard group="Colors" name="Money semantic colors" subtitle="Owed · Available · Needed · Planned" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sem{border-radius:var(--r-sm);padding:14px;border:1px solid var(--border-1)}
.sem .lbl{font:600 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}
.sem .num{font:var(--t-money);font-variant-numeric:tabular-nums}
.sem .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style></head>
<body>
<div class="row">
  <div class="sem" style="background:var(--money-owed-soft)"><div class="lbl">Owed</div><div class="num" style="color:var(--money-owed)">−$1,240.00</div><div style="font:var(--t-caption);color:var(--fg-3);margin-top:6px"><span class="dot" style="background:var(--money-owed)"></span>--money-owed · #E5484D</div></div>
  <div class="sem" style="background:var(--money-available-soft)"><div class="lbl">Available</div><div class="num" style="color:var(--money-available)">+$3,420.50</div><div style="font:var(--t-caption);color:var(--fg-3);margin-top:6px"><span class="dot" style="background:var(--money-available)"></span>--money-available · #2AAF46</div></div>
  <div class="sem" style="background:var(--money-needed-soft)"><div class="lbl">Needed</div><div class="num" style="color:var(--money-needed)">$1,980.00</div><div style="font:var(--t-caption);color:var(--fg-3);margin-top:6px"><span class="dot" style="background:var(--money-needed)"></span>--money-needed · neutral</div></div>
  <div class="sem" style="background:var(--money-planned-soft)"><div class="lbl">Planned</div><div class="num" style="color:var(--money-planned)">$320.00</div><div style="font:var(--t-caption);color:var(--fg-3);margin-top:6px"><span class="dot" style="background:var(--money-planned)"></span>--money-planned · #F1A51C</div></div>
</div>
</body></html>
