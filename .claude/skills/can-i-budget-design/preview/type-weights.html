<!doctype html>
<!-- @dsCard group="Type" name="Type weights" subtitle="Lato 100 · 300 · 400 · 700 · 900" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sp{border:1px solid var(--border-1);border-radius:var(--r-sm);padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:120px;justify-content:space-between}
.sp .big{font-family:var(--font-display);line-height:1}
.meta{font:500 10px/1.3 var(--font-mono);color:var(--fg-3)}
.w{font:600 11px/1 var(--font-sans);color:var(--fg-2);letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<div class="row">
  <div class="sp"><div class="w">Thin · 100</div><div class="big" style="font-weight:100;font-size:30px">Aa Bb 123</div><div class="meta">Rare — avoid in product</div></div>
  <div class="sp"><div class="w">Light · 300</div><div class="big" style="font-weight:300;font-size:30px">Aa Bb 123</div><div class="meta">Editorial only</div></div>
  <div class="sp"><div class="w">Regular · 400</div><div class="big" style="font-weight:400;font-size:30px">Aa Bb 123</div><div class="meta">Body, captions</div></div>
  <div class="sp"><div class="w">Bold · 700</div><div class="big" style="font-weight:700;font-size:30px">Aa Bb 123</div><div class="meta">Labels, money, h2/h3</div></div>
  <div class="sp"><div class="w">Black · 900</div><div class="big" style="font-weight:900;font-size:30px">Aa Bb 123</div><div class="meta">Display, h1, hero money</div></div>
</div>
</body></html>
