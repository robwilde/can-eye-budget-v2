<!doctype html>
<!-- @dsCard group="Components" name="Badges & chips" subtitle="Semantic pills + filter chips" viewport="700x120" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg-page);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--font-sans)}
.b{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font:600 12px/1 var(--font-sans)}
.b.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.owed{background:var(--money-owed-soft);color:var(--money-owed)}
.avail{background:var(--money-available-soft);color:var(--money-available)}
.need{background:var(--money-needed-soft);color:var(--money-needed)}
.plan{background:var(--money-planned-soft);color:var(--money-planned)}
.neutral{background:var(--cib-n-100);color:var(--fg-2)}
.brand{background:var(--cib-teal-100);color:var(--cib-teal-700)}
.chip{padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--border-2);background:#fff;font:500 13px/1 var(--font-sans);color:var(--fg-1)}
.chip.active{background:var(--cib-teal-500);color:#fff;border-color:var(--cib-teal-500)}
</style></head><body>
<span class="b dot owed">Owed</span>
<span class="b dot avail">Available</span>
<span class="b dot need">Needed</span>
<span class="b dot plan">Planned</span>
<span class="b neutral">Groceries</span>
<span class="b brand">Synced</span>
<span class="chip active">All</span>
<span class="chip">Outgoing</span>
<span class="chip">Incoming</span>
<span class="chip">Pay cycle</span>
</body></html>
