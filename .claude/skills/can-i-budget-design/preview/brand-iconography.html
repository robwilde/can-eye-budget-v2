<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Heroicons-style outlines, 24px" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans);display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.ico{width:28px;height:28px;color:var(--fg-1)}
.ico.brand{color:var(--cib-teal-500)}
.lbl{font:500 10px/1 var(--font-mono);color:var(--fg-3)}
</style>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head><body>
<div class="cell"><i data-lucide="wallet" class="ico brand"></i><div class="lbl">wallet</div></div>
<div class="cell"><i data-lucide="credit-card" class="ico"></i><div class="lbl">credit-card</div></div>
<div class="cell"><i data-lucide="banknote" class="ico"></i><div class="lbl">banknote</div></div>
<div class="cell"><i data-lucide="calendar-days" class="ico"></i><div class="lbl">calendar</div></div>
<div class="cell"><i data-lucide="pie-chart" class="ico"></i><div class="lbl">pie</div></div>
<div class="cell"><i data-lucide="trending-up" class="ico"></i><div class="lbl">trend</div></div>
<div class="cell"><i data-lucide="refresh-cw" class="ico"></i><div class="lbl">refresh</div></div>
<div class="cell"><i data-lucide="settings" class="ico"></i><div class="lbl">settings</div></div>
<div class="cell"><i data-lucide="arrow-down-right" class="ico" style="color:var(--money-owed)"></i><div class="lbl">owed</div></div>
<div class="cell"><i data-lucide="arrow-up-right" class="ico" style="color:var(--money-available)"></i><div class="lbl">incoming</div></div>
<div class="cell"><i data-lucide="link-2" class="ico"></i><div class="lbl">link</div></div>
<div class="cell"><i data-lucide="bell" class="ico"></i><div class="lbl">bell</div></div>
<div class="cell"><i data-lucide="tag" class="ico"></i><div class="lbl">tag</div></div>
<div class="cell"><i data-lucide="shopping-cart" class="ico"></i><div class="lbl">groceries</div></div>
<div class="cell"><i data-lucide="car" class="ico"></i><div class="lbl">transport</div></div>
<div class="cell"><i data-lucide="home" class="ico"></i><div class="lbl">rent</div></div>
<script>lucide.createIcons()</script>
</body></html>
