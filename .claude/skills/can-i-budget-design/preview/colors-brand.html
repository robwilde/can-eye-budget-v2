<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Teal · Yellow · Green · Cream · Outline" viewport="700x150" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-sans)}
.row{display:flex;gap:10px;align-items:stretch}
.sw{flex:1;min-width:0;border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;border:1px solid var(--border-1)}
.sw .name{font:600 13px/1.1 var(--font-sans);color:inherit}
.sw .hex{font:500 11px/1 var(--font-mono);opacity:.75}
.on-dark{color:#fff}.on-light{color:var(--cib-ink)}
</style></head>
<body>
<div class="row">
  <div class="sw on-dark" style="background:var(--cib-teal-400)"><div class="name">Teal 400 · Brand</div><div class="hex">#1E8F85</div></div>
  <div class="sw on-light" style="background:var(--cib-yellow-400)"><div class="name">Yellow 400 · Accent</div><div class="hex">#F8C93A</div></div>
  <div class="sw on-light" style="background:var(--cib-green-400)"><div class="name">Green 400 · Dollar</div><div class="hex">#3DC85A</div></div>
  <div class="sw on-light" style="background:var(--cib-cream-50);border-color:var(--border-2)"><div class="name">Cream 50 · Coin</div><div class="hex">#FFF7E1</div></div>
  <div class="sw on-dark" style="background:var(--cib-black)"><div class="name">Outline Black</div><div class="hex">#111111</div></div>
</div>
</body></html>
